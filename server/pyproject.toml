[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lab-remote-server"
version = "0.1.0"
description = "lab.remote 백엔드 — 프로젝트 생성기와 Claude Code 권한 Hooks"
requires-python = ">=3.11"
dependencies = [
  # 생성기 전용. 훅 경로에서는 import 금지 (tests/test_stdlib_only.py 로 강제)
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
api = ["fastapi", "uvicorn[standard]"]   # ③ 단계에서 사용

[project.scripts]
labremote = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
