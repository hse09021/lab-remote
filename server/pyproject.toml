[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lab-remote-server"
version = "0.1.0"
description = "lab.remote 서버 — 데스크톱에서 연구를 보고·실행하고·알림 받는 개인용 도구"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "httpx"]   # httpx: FastAPI TestClient
api = ["fastapi", "uvicorn[standard]", "claude-agent-sdk"]   # 서버(1단계) + 에이전트 세션(3단계)

[project.scripts]
labremote = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
